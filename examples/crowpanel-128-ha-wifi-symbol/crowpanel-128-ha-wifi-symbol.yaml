substitutions:
  device_name: crowpanel-128-ha-wifi-symbol
  friendly_name: CrowPanel 1.28 HA WiFi Symbol

esphome:
  name: $device_name
  friendly_name: $friendly_name
  min_version: 2024.11.0
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      - logger.log: "CrowPanel HA WiFi symbol boot"
      - output.set_level:
          id: screen_backlight_pwm
          level: 60%
      - output.turn_on: power_light
      - output.turn_on: out1_enable
      - output.turn_on: out2_enable

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

globals:
  - id: wifi_is_connected
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ha_is_connected
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: update_connection_symbol
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(ha_is_connected);"
          then:
            - lvgl.label.update:
                id: ha_wifi_symbol
                text: "\uF1EB"
            - lvgl.widget.show: ha_wifi_symbol
          else:
            - if:
                condition:
                  lambda: "return !id(wifi_is_connected);"
                then:
                  - lvgl.label.update:
                      id: ha_wifi_symbol
                      text: "X"
                  - lvgl.widget.show: ha_wifi_symbol
                else:
                  - lvgl.label.update:
                      id: ha_wifi_symbol
                      text: "!"
                  - lvgl.widget.show: ha_wifi_symbol

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - logger.log: "Home Assistant API client connected"
          - globals.set:
              id: ha_is_connected
              value: "true"
          - script.execute: update_connection_symbol
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - logger.log: "Home Assistant API client disconnected"
          - globals.set:
              id: ha_is_connected
              value: "false"
          - script.execute: update_connection_symbol

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  on_connect:
    - logger.log: "WiFi connected"
    - globals.set:
        id: wifi_is_connected
        value: "true"
    - script.execute: update_connection_symbol
  on_disconnect:
    - logger.log: "WiFi disconnected"
    - globals.set:
        id: wifi_is_connected
        value: "false"
    - globals.set:
        id: ha_is_connected
        value: "false"
    - script.execute: update_connection_symbol

spi:
  id: spi_bus
  clk_pin: GPIO10
  mosi_pin: GPIO11

output:
  - platform: ledc
    id: screen_backlight_pwm
    frequency: 5000Hz
    pin:
      number: GPIO46
      ignore_strapping_warning: true
  - platform: gpio
    id: power_light
    pin: GPIO40
  - platform: gpio
    id: out1_enable
    pin: GPIO1
  - platform: gpio
    id: out2_enable
    pin: GPIO2

display:
  - platform: mipi_spi
    id: round_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin:
      number: GPIO3
      ignore_strapping_warning: true
    reset_pin: GPIO14
    dimensions:
      width: 240
      height: 240
    invert_colors: true
    data_rate: 20MHz
    update_interval: never
    auto_clear_enabled: false

lvgl:
  displays:
    - round_display
  bg_color: 0x101820
  pages:
    - id: main_page
      bg_color: 0x101820
      pad_all: 0
      scrollable: false
      widgets:
        - label:
            id: ha_wifi_symbol
            text: "X"
            align: center
            text_align: center
            text_color: 0xFFFFFF
            text_font: montserrat_48

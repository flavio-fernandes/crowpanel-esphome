esphome:
  name: crowpanel-128-display-test
  friendly_name: CrowPanel 1.28 Display Test
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      - logger.log: "CrowPanel display test boot: enabling backlight"
      - output.set_level:
          id: screen_backlight_pwm
          level: 60%
      - delay: 200ms
      - output.turn_on: power_light
      - output.turn_on: out1_enable
      - output.turn_on: out2_enable
      - component.update: round_display

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

spi:
  id: spi_bus
  clk_pin: GPIO10
  mosi_pin: GPIO11

output:
  - platform: ledc
    id: screen_backlight_pwm
    frequency: 5000Hz
    pin:
      number: GPIO46
      ignore_strapping_warning: true
  - platform: gpio
    id: power_light
    pin: GPIO40
  - platform: gpio
    id: out1_enable
    pin: GPIO1
  - platform: gpio
    id: out2_enable
    pin: GPIO2

display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    cs_pin: GPIO9
    dc_pin:
      number: GPIO3
      ignore_strapping_warning: true
    reset_pin: GPIO14
    dimensions:
      width: 240
      height: 240
    invert_colors: true
    rotation: 0
    data_rate: 20MHz
    auto_clear_enabled: false
    update_interval: 1s
    lambda: |-
      it.fill(Color(0, 64, 160));
      it.filled_circle(120, 120, 72, Color(0, 0, 0));
      it.circle(120, 120, 112, Color(255, 255, 255));
      it.circle(120, 120, 76, Color(255, 255, 0));
      it.line(0, 120, 239, 120, Color(255, 255, 255));
      it.line(120, 0, 120, 239, Color(255, 255, 255));

interval:
  - interval: 5s
    then:
      - logger.log: "CrowPanel display test alive"
